<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Keywords" content="Hola">
    <title>inicio sesion</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <form class="card">
    <h2>
        INICIAR SESIÓN
    </h2>
    <div class="inputs">
        <fieldset>
            <legend>Datos de ingreso</legend>
        <label for="nombre">Ingresa tus nombres</label>
        <input type="text" placeholder="Nombre completo" id="nombre" required>
        <label for="email">Correo electrónico</label>
        <input type="email" placeholder="Email" id="email" required>
        <label for="clave">Digite su contraseña</label>
        <input type="password" required id="clave" required>
        </fieldset>
        <input type="submit" value="Inicia sesión" >
    </div>
    
    </form>
</body>
</html>
