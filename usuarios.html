<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Keywords" content="Hola">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <form class="card">

    <h2>
        REGISTRO DE USUARIO
    </h2>

    <div class="inputs">

        <fieldset>
            <legend>Datos personales</legend>
                <label for="nombre">Ingresa tus nombres</label>
                    <input type="text" placeholder="Nombre completo" id="nombre">
                <label for="apellidos">Ingresa tus apellidos</label>
                    <input type="text" placeholder="Apellidos" id="apellidos">
                <label for="email">Correo electrónico</label>
                    <input type="email" placeholder="Email" id="email">
                <label for="numero">Ingresa tu edad</label>
                    <input type="number" placeholder="Edad" id="numero">
                <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena">

        </fieldset>
        
        <input type="submit" value="Registrate" >

    </div>
    
    </form>

</body>
</html>
